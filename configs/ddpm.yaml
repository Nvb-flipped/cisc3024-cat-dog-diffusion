model:
  channels: [48, 96, 144, 192]  # Required fallback: original implementation measured 18,318,147 parameters.
  blocks_per_level: 2
  conditioning_dim: 256
  attention_heads: 4
  dropout: 0.10
diffusion:
  timesteps: 1000
  cosine_offset: 0.008
training:
  updates: 50000
  effective_batch: 128
  microbatch: 64
  learning_rate: 0.0002
  betas: [0.9, 0.999]
  weight_decay: 0.0001
  warmup: 2000
  grad_clip: 1.0
  ema_decay: 0.9999
  null_probability: 0.10
  checkpoint_every: 10000
  log_every: 100
  precision: bf16
  threads: 8
sampling:
  steps: 100
  guidance: 1.5
  microbatch: 32
  execution_batch: 32
